<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChudVault - Redirecionamento</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    /* Subtle background grid */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(rgba(102, 252, 241, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(102, 252, 241, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    .card {
      position: relative;
      background: rgba(31, 40, 51, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(102, 252, 241, 0.2);
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(102, 252, 241, 0.1);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .card:hover {
      border-color: rgba(102, 252, 241, 0.5);
      transform: translateY(-2px);
    }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #66fcf1;
      background: rgba(102, 252, 241, 0.1);
      border: 1px solid rgba(102, 252, 241, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    h1 {
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #9aa0a6;
      margin-bottom: 32px;
    }
    .btn-enter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 28px;
      background: linear-gradient(135deg, #45a29e 0%, #66fcf1 100%);
      color: #0b0c10;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      border: none;
      box-shadow: 0 8px 24px rgba(102, 252, 241, 0.3);
      transition: all 0.25s ease;
    }
    .btn-enter:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 30px rgba(102, 252, 241, 0.5);
      background: linear-gradient(135deg, #66fcf1 0%, #45a29e 100%);
    }
    .btn-enter:active {
      transform: scale(0.98);
    }
    .destination {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #6c757d;
    }
    .destination span {
      color: #66fcf1;
      font-family: monospace;
      font-weight: 600;
    }
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #66fcf1;
      margin-right: 6px;
      animation: pulseAnim 1.8s infinite;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="pulse"></span>Portal de Acesso</div>
    <h1>ChudVault</h1>
    <p>Clique no botão abaixo para ser redirecionado com segurança para o domínio oficial.</p>
    
    <a href="https://nazistas.online" class="btn-enter" id="accessBtn">
      Acessar Site Oficial
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>

    <div class="destination">
      Destino: <span>https://nazistas.online</span>
    </div>
  </div>

  <script>
    // Permite clicar em qualquer lugar da tela com a tecla Enter ou Space para ir direto
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        window.location.href = 'https://nazistas.online';
      }
    });
  </script>
</body>
</html>
